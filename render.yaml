services:
  - type: web
    name: orchiimmo
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py import_ml_csv && python manage.py shell -c \"from django.contrib.auth.models import User; User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'simohamedhadi05@gmail.com', 'Orchi2026!')\" && (mkdir -p /opt/render/project/.render/chrome && python -m playwright install chromium || echo 'Playwright install echoue - fallback headless desactive') && echo 'Build OK'"
    startCommand: "gunicorn config.wsgi:application --workers 1 --threads 2 --worker-class gthread --bind 0.0.0.0:$PORT --timeout 120 --max-requests 500 --max-requests-jitter 50 --keep-alive 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_prod
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.render/chrome
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: ALLOWED_HOSTS
        value: "orchiimmo.onrender.com,orchiimmo-2a62.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://orchiimmo.onrender.com,https://orchiimmo-2a62.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: simohamedhadi05@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: Orchi2026!
      - key: SCRAPE_AUTO_ENABLED
        value: "False"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
      - key: DEFAULT_FROM_EMAIL
        value: "Orchiimmo <noreply@orchiimmo.ma>"
      - key: DATABASE_URL
        fromDatabase:
          name: orchiimmo-db-2
          property: connectionString

databases:
  - name: orchiimmo-db-2
    databaseName: orchiimmo_db_2
    plan: free
    region: frankfurt
